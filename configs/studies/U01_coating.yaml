name: U01_coating
title: "U1 - light collection vs channel coating (single channel, optical gun)"
description: >
  One hexagonal cell, CsI(Tl) core D = 200 um, L = 30 mm, ideal sensor. Optical photons with the
  CsI(Tl) spectrum are emitted isotropically and uniformly inside the core, so only the light
  transport is tested: the coating model, its reflectivity and angular behaviour.
  For bare / thin-film channels part of the light leaves the core and is guided inside the glass
  wall to the sensor; `optical_crosstalk` shows that share - in the full detector it ends up in
  neighbouring pixels (see U07 / U08).
explain:
  question: "Какое покрытие стенок канала доводит до сенсора больше всего света?"
  why: >
    Свет рождается прямо в сцинтилляторе одного канала (оптическая пушка), рентгена нет: так
    сравнивается только транспорт света, без шума поглощения. Сенсор идеальный (QE = 1), чтобы его
    спектральная чувствительность не смешивалась с покрытием. L = 30 мм — исходная длина, на ней
    разница между покрытиями видна сильнее всего (много отражений). В список входят все модели
    поверхности: металлы (Al, Ag, Au) с комплексным n+ik, белые диффузные краски, измеренные таблицы
    LUT и эталоны ideal (R = 1) / black (R = 0), между которыми лежит любое реальное покрытие.
  expect: >
    Ag лучше Al и Au (меньше потерь на отражение), диффузные краски хуже зеркальных в длинном узком
    канале. Голый канал (none) даёт много света за счёт ПВО, но значительная его часть уходит в стенку —
    это оптический кросс-ток.
  read: >
    Главная величина — lce. coat_abs_prob — сколько теряется за одно касание покрытия, mean_refl_det —
    сколько отражений нужно фотону. optical_crosstalk > 0 означает, что свет идёт в чужие пиксели.
base: unit_optical.yaml
scan:
  optics.coating: [none, air_gap, MgF2_film, black, ideal, Al, Al_simple, Ag, Au, TiO2, BaSO4, Teflon,
                   ESR_LUT, Teflon_LUT, ESR_LUT_BGO, Tyvek_LUT, TiO2_LUT]
quick: {run.events: 10, beam.optical.n: 100}
metrics: [lce, lce_exit, coat_abs_prob, mean_refl_det, t_det_median_ns, optical_crosstalk]
labels:
  lce: "Light collection efficiency (ideal sensor)"
  lce_exit: "Fraction leaving the channel to the sensor"
  coat_abs_prob: "Absorption probability per coating hit"
  mean_refl_det: "Mean reflections of detected photons"
  t_det_median_ns: "Median arrival time [ns]"
xlabel: "Coating"
