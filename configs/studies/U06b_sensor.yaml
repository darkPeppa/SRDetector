name: U06b_sensor
title: "U6b - photodetector technology: signal, noise and cost"
description: >
  60 keV X-rays in one CsI(Tl) channel read by different photodetectors. QE(lambda) x fill factor
  is applied on the sensor surface; read noise, pixel pitch and relative cost come from the
  catalogue (typical data-sheet values). Figures of merit: detected photo-electrons per keV,
  SNR for a 60 keV photon in one channel, and photo-electrons per keV per unit cost.
explain:
  question: "Какой фотоприёмник выбрать с учётом сигнала, шума и цены?"
  why: >
    Один канал CsI(Tl), рентген 60 кэВ: так в сигнал входят и поглощение, и транспорт света, и QE
    сенсора. Список охватывает все технологии каталога — от дешёвой a-Si панели до EMCCD; ideal (QE = 1)
    служит верхней границей.
  expect: "Дорогие BSI-сенсоры дают больше фотоэлектронов, a-Si — лучше по сигналу на единицу цены; ФЭУ плохо согласован с зелёным светом CsI(Tl)."
  read: "Смотрите det_yield_per_keV относительно ideal и det_yield_per_cost; SNR учитывает шум чтения одного канала."
base: unit_xray.yaml
scan:
  geometry.sensor: [ideal, aSi_FPD, CMOS_FSI, sCMOS_BSI, SiPM, PMT_bialkali, EMCCD]
quick: {run.events: 50}
metrics: [det_yield_per_keV, snr_60keV_per_channel, det_yield_per_cost, lce]
labels: {det_yield_per_keV: "Photo-electrons per keV", snr_60keV_per_channel: "SNR at 60 keV (1 channel)", det_yield_per_cost: "pe/keV per relative cost", lce: "LCE incl. QE"}
xlabel: "Sensor"
