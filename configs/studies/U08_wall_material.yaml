name: U08_wall_material
title: "U8 - honeycomb wall material"
description: >
  Lead glass stops cross-talk X-rays but absorbs part of the beam; low-Z glass does the opposite.
  60 keV uniform beam on the central cell of a 7-cell cluster, bare and Al-coated channels.
explain:
  question: "Из какого стекла делать стенки сот?"
  why: >
    Свинцовое стекло (MCP, NIST) поглощает K-флуоресценцию I/Cs и вторичные электроны рядом с каналом,
    боросиликат и кварц почти прозрачны для них, но меньше поглощают сам пучок. Шаг 220 мкм — компромисс
    из U07. Голые и покрытые каналы — потому что для голых важен ещё показатель преломления стекла.
  expect: "Свинцовое стекло — меньше ЭМ-кросс-тока; для голых каналов лучше стекло с низким n."
  read: "Сравнивайте em_crosstalk и mean_edep_wall_keV (сколько энергии съело стекло)."
base: cluster7_xray.yaml
set: {geometry.pitch: 220 um}
scan:
  optics.coating: [none, Al]
  geometry.wall_material: [LeadGlass_MCP, LeadGlass_NIST, Borosilicate, FusedSilica]
x: geometry.wall_material
series: optics.coating
quick: {run.events: 50}
metrics: [detection_efficiency, em_crosstalk, optical_crosstalk, mean_edep_wall_keV, det_yield_per_keV, psf_r50_um, psf_in_cell_fraction]
labels: {psf_r50_um: "Light spread r50 [um]", psf_in_cell_fraction: "Light inside own cell", detection_efficiency: "Events with core deposit", em_crosstalk: "Energy outside the hit cell", optical_crosstalk: "Detected light from other cells", mean_edep_wall_keV: "Mean deposit in walls [keV]"}
xlabel: "Wall material"
