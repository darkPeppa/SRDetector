name: study_B02_sources
description: Full detector, R = 11 mm, L = 30 mm, 9367 hexagonal cells, CsI(Tl) cores,
  Al coating, a-Si panel.
geometry:
  mode: full
  detector_radius: 11 mm
  length: 30 mm
  pitch: 208 um
  channel_diameter: 200 um
  channel_shape: circle
  wall_material: LeadGlass_MCP
  matrix_material: ''
  core_material: CsI_Tl
  coating_thickness: 2 um
  coating_material: ''
  world_material: Air
  housing_material: G4_Al
  housing_thickness: 1 mm
  window_material: G4_Be
  window_thickness: 0.5 mm
  coupling_material: OpticalGrease
  coupling_thickness: 50 um
  sensor: aSi_FPD
  sensor_window_thickness: -1 mm
  sensor_active_thickness: 20 um
  slab_material: CsI_Tl
  slab_thickness: 1 mm
  slab_half_xy: 50 mm
  world_margin: 50 mm
  check_overlaps: false
optics:
  coating: Al
  coating_reflectivity: 0.9
  coating_sigma_alpha: 0 deg
  film_thickness: 0.5 um
  entrance_coating: Al
materials:
  yield_scale: 0.05
  overrides: []
physics:
  em: livermore
  radioactive: false
  fluo: true
  auger: true
  pixe: false
  deexcitation_ignore_cut: true
  low_edge: 250 eV
  cut_world: 0.1 mm
  cut_detector: 1 um
  optical:
    scintillation: true
    cerenkov: true
    absorption: true
    rayleigh: true
    mie: false
    boundary: true
    wls: false
    cerenkov_max_photons: 100
    cerenkov_max_beta_change: 10
    track_secondaries_first: true
    finite_rise_time: false
beam:
  type: parallel
  particle: gamma
  energy: 60 keV
  spectrum: null
  position:
  - 0 mm
  - 0 mm
  radius: 10 mm
  sigma: 1 mm
  half_angle: 5 deg
  distance: 100 mm
  optical:
    n: 1000
    energy: 0 eV
    z: 0 mm
    z_uniform: true
    r_uniform: true
    theta: -1 deg
  macro: null
run:
  events: 2000
  threads: 0
  seed: 12345
  photon_fraction: 0.2
  cell_hits: false
  gdml: false
  histograms: auto
  extra_commands: []
  post_commands: []
study:
  name: B02_sources
  title: B2 - radioactive sources and X-ray tube spectra on the full detector
  description: 'Parallel beam (r = 10 mm) with the photon spectrum of Am-241, Co-57,
    Cs-137 and a W-anode tube at 80 and 120 kVp (2.5 mm Al filtration, approximate
    Kramers model).

    '
  base: full.yaml
  scan:
    beam.spectrum:
    - source: Am241
    - source: Co57
    - source: Cs137
    - xray_tube:
        kvp: 80
    - xray_tube:
        kvp: 120
  x_names:
  - Am-241
  - Co-57
  - Cs-137
  - W 80 kVp
  - W 120 kVp
  quick:
    run.events: 30
  metrics:
  - mean_edep_core_keV
  - detection_efficiency
  - k_escape_fraction
  - mean_n_det
  - mean_cells_hit
  labels:
    mean_edep_core_keV: Mean core deposit [keV]
    detection_efficiency: Events with core deposit
    mean_n_det: Mean detected photons
    mean_cells_hit: Cells hit
  xlabel: Source
