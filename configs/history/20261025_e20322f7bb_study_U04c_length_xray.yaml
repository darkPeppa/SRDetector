name: study_U04c_length_xray
description: Full cylindrical honeycomb detector, CsI(Tl) channels with Al coating
  (legacy dimensions).
geometry:
  mode: unit
  detector_radius: 11 mm
  length: 30 mm
  pitch: 208 um
  channel_diameter: 200 um
  channel_shape: circle
  wall_material: LeadGlass_MCP
  matrix_material: ''
  core_material: CsI_Tl
  coating_thickness: 2 um
  coating_material: ''
  world_material: Air
  housing_material: G4_Al
  housing_thickness: 1 mm
  window_material: G4_Be
  window_thickness: 0.5 mm
  coupling_material: OpticalGrease
  coupling_thickness: 50 um
  sensor: aSi_FPD
  sensor_window_thickness: -1 mm
  sensor_active_thickness: 20 um
  slab_material: CsI_Tl
  slab_thickness: 1 mm
  slab_half_xy: 50 mm
  world_margin: 50 mm
  check_overlaps: false
optics:
  coating: Ag
  coating_reflectivity: 0.9
  coating_sigma_alpha: 0 deg
  film_thickness: 0.5 um
  entrance_coating: Al
materials:
  yield_scale: 0.2
  overrides: []
physics:
  em: livermore
  radioactive: false
  fluo: true
  auger: true
  pixe: false
  deexcitation_ignore_cut: true
  low_edge: 250 eV
  cut_world: 0.1 mm
  cut_detector: 1 um
  optical:
    scintillation: true
    cerenkov: true
    absorption: true
    rayleigh: true
    mie: false
    boundary: true
    wls: false
    cerenkov_max_photons: 100
    cerenkov_max_beta_change: 10
    track_secondaries_first: true
    finite_rise_time: false
beam:
  type: pencil
  particle: gamma
  energy: 60 keV
  spectrum: null
  position:
  - 0 mm
  - 0 mm
  radius: 5 mm
  sigma: 1 mm
  half_angle: 5 deg
  distance: 100 mm
  optical:
    n: 1000
    energy: 0 eV
    z: 0 mm
    z_uniform: true
    r_uniform: true
    theta: -1 deg
  macro: null
run:
  events: 1000
  threads: 0
  seed: 12345
  photon_fraction: 0.0
  cell_hits: false
  gdml: false
  tracks: 0
  tracks_optical_every: 50
  histograms: auto
  extra_commands: []
  post_commands: []
study:
  name: U04c_length_xray
  title: 'U4c - channel length with X-rays: absorption vs light loss (Ag, 30-662 keV)'
  description: 'One Ag-coated CsI(Tl) channel, pencil X-ray beam along the axis, a-Si
    panel. Short channels let X-rays through, long channels lose the light: the signal
    per incident keV has an optimum L that moves with the beam energy.

    '
  explain:
    question: Какая длина канала оптимальна для данной энергии рентгена и почему?
    why: 'U04 показывает только потерю света, но короткий канал ещё и пропускает рентген.
      Здесь оба эффекта вместе: узкий пучок вдоль оси одного канала с Ag-покрытием,
      сенсор — a-Si панель. Длины 0.1–30 мм (log) и шесть энергий: 30 кэВ (ниже K-края
      I), 60 кэВ (основная), 100 и 150 кэВ, а также 300 и 662 кэВ (Cs-137) — там длина
      ослабления в CsI порядка сантиметров, и видно, для чего годятся исходные 30
      мм. Итоговая величина pe_per_incident_keV = det_yield_per_keV × detection_efficiency
      — сколько фотоэлектронов даёт каждый кэВ падающего (а не поглощённого) пучка.

      '
    expect: 'detection_efficiency растёт с L и насыщается после нескольких длин ослабления,
      det_yield_per_keV падает с L. Произведение имеет максимум, примерно при L ≈
      3/μ(E): доли мм при 30 кэВ, ~1 мм при 60 кэВ и несколько мм при 150 кэВ; при
      300–662 кэВ поглощение не насыщается и до 30 мм, но в одном канале 200 мкм комптоновский
      фотон уходит в соседей, поэтому сигнал на кэВ падающего мал.

      '
    read: 'Найдите максимум pe_per_incident_keV для своей энергии; слева от него теряется
      рентген, справа — свет. Сравните с оптимумом O01 (там ещё учитываются стенки,
      пятно и кросс-ток).

      '
  base: unit_xray.yaml
  set:
    optics.coating: Ag
    run.events: 1000
  scan:
    beam.energy:
    - 30 keV
    - 60 keV
    - 100 keV
    - 150 keV
    - 300 keV
    - 662 keV
    geometry.length:
    - 0.1 mm
    - 0.2 mm
    - 0.5 mm
    - 1 mm
    - 2 mm
    - 5 mm
    - 10 mm
    - 20 mm
    - 30 mm
  derived:
    pe_per_incident_keV: det_yield_per_keV * detection_efficiency
  x: geometry.length
  series: beam.energy
  logx: true
  quick:
    run.events: 40
  metrics:
  - pe_per_incident_keV
  - detection_efficiency
  - det_yield_per_keV
  - photopeak_fraction
  labels:
    pe_per_incident_keV: pe per incident keV
    detection_efficiency: Events with core deposit
    det_yield_per_keV: pe per absorbed keV
    photopeak_fraction: Full-energy fraction
  xlabel: Channel length L [mm]
