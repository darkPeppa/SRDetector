name: study_U04_length
description: Full cylindrical honeycomb detector, CsI(Tl) channels with Al coating
  (legacy dimensions).
geometry:
  mode: unit
  detector_radius: 11 mm
  length: 30 mm
  pitch: 208 um
  channel_diameter: 200 um
  channel_shape: circle
  wall_material: LeadGlass_MCP
  matrix_material: ''
  core_material: CsI_Tl
  coating_thickness: 2 um
  coating_material: ''
  world_material: Air
  housing_material: G4_Al
  housing_thickness: 1 mm
  window_material: G4_Be
  window_thickness: 0.5 mm
  coupling_material: OpticalGrease
  coupling_thickness: 50 um
  sensor: ideal
  sensor_window_thickness: -1 mm
  sensor_active_thickness: 20 um
  slab_material: CsI_Tl
  slab_thickness: 1 mm
  slab_half_xy: 50 mm
  world_margin: 50 mm
  check_overlaps: false
optics:
  coating: Al
  coating_reflectivity: 0.9
  coating_sigma_alpha: 0 deg
  film_thickness: 0.5 um
  entrance_coating: Al
materials:
  yield_scale: 1.0
  overrides: []
physics:
  em: livermore
  radioactive: false
  fluo: true
  auger: true
  pixe: false
  deexcitation_ignore_cut: true
  low_edge: 250 eV
  cut_world: 0.1 mm
  cut_detector: 1 um
  optical:
    scintillation: true
    cerenkov: true
    absorption: true
    rayleigh: true
    mie: false
    boundary: true
    wls: false
    cerenkov_max_photons: 100
    cerenkov_max_beta_change: 10
    track_secondaries_first: true
    finite_rise_time: false
beam:
  type: optical
  particle: gamma
  energy: 60 keV
  spectrum: null
  position:
  - 0 mm
  - 0 mm
  radius: 5 mm
  sigma: 1 mm
  half_angle: 5 deg
  distance: 100 mm
  optical:
    n: 500
    energy: 0 eV
    z: 0 mm
    z_uniform: true
    r_uniform: true
    theta: -1 deg
  macro: null
run:
  events: 200
  threads: 0
  seed: 12345
  photon_fraction: 0.0
  cell_hits: false
  gdml: false
  tracks: 0
  tracks_optical_every: 50
  histograms: auto
  extra_commands: []
  post_commands: []
study:
  name: U04_length
  title: U4a - light collection vs channel length L (0.2 - 100 mm)
  description: 'Aspect ratio L/D at fixed D = 200 um. Longer channels absorb more
    X-rays but need more reflections: N ~ L / (D tan(theta)).

    '
  explain:
    question: Как светосбор падает с длиной канала и с какой длины покрытие начинает
      решать всё?
    why: 'Оптическая пушка в одном канале (D = 200 мкм, идеальный сенсор): фотоны
      рождаются равномерно по всей длине, поэтому видна чистая потеря света на отражениях.
      Длины идут в log-шкале от 0.2 мм (L/D = 1, свет почти не отражается) до 100
      мм (L/D = 500, сотни отражений): так видны оба предела и переход между ними.
      Три покрытия — сильно поглощающий Al, лучший металл Ag и диффузно-зеркальный
      ESR — показывают, что для коротких каналов покрытие почти неважно, а для длинных
      — главное. Сколько рентгена поглощается при каждой длине, показывает U04c.

      '
    expect: 'LCE падает примерно как R^N(L): у Al в разы быстрее, чем у Ag. Короткие
      каналы (L ≲ 2 мм) дают близкий свет при любом покрытии.

      '
    read: 'Логарифмическая ось x: наклон кривой — потеря на отражениях. mean_refl_det
      растёт ∝ L для зеркал; у ESR он насыщается, потому что дальние фотоны просто
      не доходят.

      '
  base: unit_optical.yaml
  scan:
    optics.coating:
    - Al
    - Ag
    - ESR_LUT
    geometry.length:
    - 0.2 mm
    - 0.5 mm
    - 1 mm
    - 2 mm
    - 3 mm
    - 5 mm
    - 10 mm
    - 20 mm
    - 30 mm
    - 50 mm
    - 100 mm
  x: geometry.length
  series: optics.coating
  logx: true
  quick:
    run.events: 10
    beam.optical.n: 100
  metrics:
  - lce
  - mean_refl_det
  labels:
    lce: Light collection efficiency
    mean_refl_det: Mean reflections (detected)
  xlabel: Channel length L [mm]
