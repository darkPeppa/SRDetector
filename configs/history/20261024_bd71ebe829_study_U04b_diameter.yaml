name: study_U04b_diameter
description: Full cylindrical honeycomb detector, CsI(Tl) channels with Al coating
  (legacy dimensions).
geometry:
  mode: unit
  detector_radius: 11 mm
  length: 30 mm
  pitch: 208 um
  channel_diameter: 200 um
  channel_shape: circle
  wall_material: LeadGlass_MCP
  matrix_material: ''
  core_material: CsI_Tl
  coating_thickness: 2 um
  coating_material: ''
  world_material: Air
  housing_material: G4_Al
  housing_thickness: 1 mm
  window_material: G4_Be
  window_thickness: 0.5 mm
  coupling_material: OpticalGrease
  coupling_thickness: 50 um
  sensor: ideal
  sensor_window_thickness: -1 mm
  sensor_active_thickness: 20 um
  slab_material: CsI_Tl
  slab_thickness: 1 mm
  slab_half_xy: 50 mm
  world_margin: 50 mm
  check_overlaps: false
optics:
  coating: Al
  coating_reflectivity: 0.9
  coating_sigma_alpha: 0 deg
  film_thickness: 0.5 um
  entrance_coating: Al
materials:
  yield_scale: 1.0
  overrides: []
physics:
  em: livermore
  radioactive: false
  fluo: true
  auger: true
  pixe: false
  deexcitation_ignore_cut: true
  low_edge: 250 eV
  cut_world: 0.1 mm
  cut_detector: 1 um
  optical:
    scintillation: true
    cerenkov: true
    absorption: true
    rayleigh: true
    mie: false
    boundary: true
    wls: false
    cerenkov_max_photons: 100
    cerenkov_max_beta_change: 10
    track_secondaries_first: true
    finite_rise_time: false
beam:
  type: optical
  particle: gamma
  energy: 60 keV
  spectrum: null
  position:
  - 0 mm
  - 0 mm
  radius: 5 mm
  sigma: 1 mm
  half_angle: 5 deg
  distance: 100 mm
  optical:
    n: 500
    energy: 0 eV
    z: 0 mm
    z_uniform: true
    r_uniform: true
    theta: -1 deg
  macro: null
run:
  events: 200
  threads: 0
  seed: 12345
  photon_fraction: 0.0
  cell_hits: false
  gdml: false
  histograms: auto
  extra_commands: []
  post_commands: []
study:
  name: U04b_diameter
  title: U4b - light collection vs channel diameter D (wall 8 um kept constant)
  description: 'D and pitch are scanned together (zip) so that the wall thickness
    stays at 8 um - 2 x 2 um coating.

    '
  base: unit_optical.yaml
  mode: zip
  scan:
    geometry.channel_diameter:
    - 25 um
    - 50 um
    - 100 um
    - 200 um
    - 400 um
    geometry.pitch:
    - 33 um
    - 58 um
    - 108 um
    - 208 um
    - 408 um
  x: geometry.channel_diameter
  logx: true
  quick:
    run.events: 10
    beam.optical.n: 100
  metrics:
  - lce
  - mean_refl_det
  - geometry_fill_factor
  labels:
    lce: Light collection efficiency
    mean_refl_det: Mean reflections (detected)
    geometry_fill_factor: Core area fraction
  xlabel: Channel diameter D [mm]
