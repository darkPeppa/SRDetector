name: study_F01_full_comparison
description: Full detector, R = 11 mm, L = 30 mm, 9367 hexagonal cells, CsI(Tl) cores,
  Al coating, a-Si panel.
geometry:
  mode: full
  detector_radius: 11 mm
  length: 30 mm
  pitch: 208 um
  channel_diameter: 200 um
  channel_shape: circle
  wall_material: LeadGlass_MCP
  matrix_material: ''
  core_material: CsI_Tl
  coating_thickness: 2 um
  coating_material: ''
  world_material: Air
  housing_material: G4_Al
  housing_thickness: 1 mm
  window_material: G4_Be
  window_thickness: 0.5 mm
  coupling_material: OpticalGrease
  coupling_thickness: 50 um
  sensor: aSi_FPD
  sensor_window_thickness: -1 mm
  sensor_active_thickness: 20 um
  slab_material: CsI_Tl
  slab_thickness: 1 mm
  slab_half_xy: 50 mm
  world_margin: 50 mm
  check_overlaps: false
optics:
  coating: Al
  coating_reflectivity: 0.9
  coating_sigma_alpha: 0 deg
  film_thickness: 0.5 um
  entrance_coating: Al
materials:
  yield_scale: 0.05
  overrides: []
physics:
  em: livermore
  radioactive: false
  fluo: true
  auger: true
  pixe: false
  deexcitation_ignore_cut: true
  low_edge: 250 eV
  cut_world: 0.1 mm
  cut_detector: 1 um
  optical:
    scintillation: true
    cerenkov: true
    absorption: true
    rayleigh: true
    mie: false
    boundary: true
    wls: false
    cerenkov_max_photons: 100
    cerenkov_max_beta_change: 10
    track_secondaries_first: true
    finite_rise_time: false
beam:
  type: parallel
  particle: gamma
  energy: 60 keV
  spectrum: null
  position:
  - 0 mm
  - 0 mm
  radius: 10 mm
  sigma: 1 mm
  half_angle: 5 deg
  distance: 100 mm
  optical:
    n: 1000
    energy: 0 eV
    z: 0 mm
    z_uniform: true
    r_uniform: true
    theta: -1 deg
  macro: null
run:
  events: 2000
  threads: 0
  seed: 12345
  photon_fraction: 0.2
  cell_hits: false
  gdml: false
  histograms: auto
  extra_commands: []
  post_commands: []
study:
  name: F01_full_comparison
  title: 'F1 - full detector: baseline vs optimised variants (60 keV, parallel beam)'
  description: 'Candidate full-detector configurations built from the single-parameter
    studies, compared on the same beam: detection efficiency, light yield, resolution
    limit, cross-talk and cost figures.

    '
  base: full.yaml
  variants:
  - label: baseline_Al_L30
    set: {}
  - label: legacy_materials_L30
    set:
      geometry.wall_material: Legacy_fred
      optics.coating: Al_simple
      optics.entrance_coating: none
  - label: Ag_L30
    set:
      optics.coating: Ag
  - label: ESR_L30
    set:
      optics.coating: ESR_LUT
  - label: Al_L2
    set:
      geometry.length: 2 mm
  - label: Ag_L2
    set:
      optics.coating: Ag
      geometry.length: 2 mm
  - label: ESR_L2
    set:
      optics.coating: ESR_LUT
      geometry.length: 2 mm
  - label: Ag_L2_pitch220
    set:
      optics.coating: Ag
      geometry.length: 2 mm
      geometry.pitch: 220 um
  - label: Ag_L2_sCMOS
    set:
      optics.coating: Ag
      geometry.length: 2 mm
      geometry.sensor: sCMOS_BSI
  x: variant
  quick:
    run.events: 20
  metrics:
  - detection_efficiency
  - photopeak_fraction
  - det_yield_per_keV
  - resolution_fwhm_poisson_limit
  - em_crosstalk
  - optical_crosstalk
  - snr_60keV_per_channel
  - det_yield_per_cost
  - psf_r50_um
  - psf_in_cell_fraction
  labels:
    psf_r50_um: Light spread r50 [um]
    psf_in_cell_fraction: Light inside own cell
    detection_efficiency: Events with core deposit
    photopeak_fraction: Full-energy fraction
    det_yield_per_keV: pe/keV
    resolution_fwhm_poisson_limit: FWHM Poisson limit
    em_crosstalk: EM cross-talk
    optical_crosstalk: Optical cross-talk
    snr_60keV_per_channel: SNR 60 keV / channel
    det_yield_per_cost: pe/keV per cost
  xlabel: Configuration
