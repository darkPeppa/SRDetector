name: U02_reflectivity
title: U2 - light collection vs specular reflectivity R
description: 'Ideal specular mirror with constant R. Every photon needs about N reflections
  to leave the channel, so LCE should follow LCE(1)·R^N; the overlay uses the measured
  mean N at R = 1. Validates the reflection bookkeeping and shows how fast the light
  loss grows with 1 - R.

  '
base: unit_optical.yaml
set:
  optics.coating: mirror
  run.photon_fraction: 1.0
scan:
  optics.coating_reflectivity:
  - 0.8
  - 0.85
  - 0.9
  - 0.93
  - 0.95
  - 0.97
  - 0.98
  - 0.99
  - 0.995
  - 1.0
quick:
  run.events: 10
  beam.optical.n: 100
metrics:
- lce
- coat_abs_prob
- mean_refl_det
reference: reflectivity
labels:
  lce: Light collection efficiency
  coat_abs_prob: Absorption per coating hit
  mean_refl_det: Mean reflections (detected)
xlabel: Coating reflectivity R
